syntax = "proto3";

package n0x.control.v1;

import "n0x/alerts/v1/alerts.proto";
import "n0x/connectivity/v1/connectivity.proto";
import "n0x/signed/v1/signed.proto";
import "n0x/workloads/v1/workloads.proto";

option go_package = "github.com/n-0x/x-api-go/control/v1;controlv1";

message HaPolicy {
  string version = 1;
  repeated string candidates = 2;
}

message ScopeState {
  string preferred_instance = 1;
  int64 initial_claim_after = 2;
  string owner_instance = 3;
  string handoff_to = 4;
  string handoff_runtime_id = 5;
  string handoff_key_sha256 = 6;
  HaPolicy ha_policy = 7;
  string id = 8;
  Scope scope = 9;
  string commit = 10;
  string bootstrap_hash = 11;
  string initial_owner_id = 12;
  string owner_id = 13;
  string owner_runtime_id = 14;
  string owner_key_sha256 = 15;
  string owner_epoch = 16;
  string binding_generation = 17;
  string revision = 18;
  string hash = 19;
  string grant_seq = 20;
  int64 max_grant_expires_at = 21;
}

message Activation {
  string id = 1;
  Scope scope = 2;
  string incarnation_id = 3;
  string spiffe_id = 4;
  string boot_id = 5;
  string session_generation = 6;
  string binding_generation = 7;
  string key_sha256 = 8;
  int64 cert_not_after = 9;
  bool data_active = 10;
}

message Emission {
  string id = 1;
  Scope scope = 2;
  string grant_id = 3;
  string owner_runtime_id = 4;
  string owner_epoch = 5;
  string owner_key_sha256 = 6;
  string revision = 7;
  string hash = 8;
  string raw = 9;
  bool delivered = 10;
  int64 expires_at = 11;
}

message AckRequest {
  n0x.signed.v1.NodeReport report = 1;
  string owner_key_sha256 = 2;
  string node_key_sha256 = 3;
  string digest = 4;
}

message RecoveryCommit {
  Scope scope = 1;
  string incarnation_id = 2;
  string boot_id = 3;
  string session_generation = 4;
  string expected_binding = 5;
  string expected_key = 6;
  string request_id = 7;
  string client_nonce = 8;
  string owner_runtime_id = 9;
  string owner_epoch = 10;
  string owner_key_sha256 = 11;
}

message ObservationView {
  string incarnation_id = 1;
  string boot_id = 2;
  string session_generation = 3;
  string binding_generation = 4;
  string owner_epoch = 5;
  string owner_runtime_id = 6;
  string applied_revision = 7;
  string applied_hash = 8;
  string status = 9;
  string error = 10;
  int64 observed_at = 11;
  int64 lease_expires_at = 12;
  bool fresh = 13;
  bool ready = 14;
  FlowTelemetry telemetry = 50;
}

message Scope {
  string tenant_id = 1;
  string network_id = 2;
  string partition_id = 3;
}

message Route {
  Scope scope = 1;
  string owner_runtime_id = 2;
  string owner_id = 3;
  string address = 4;
  string epoch = 5;
}

message ProjectionSnapshot {
  repeated ObservationView views = 1;
}

message ClaimableSnapshot {
  repeated ScopeState scopes = 1;
}

message DrainResult {
  repeated Scope drained = 1;
  repeated Scope failed = 2;
}

message OwnerCandidate {
  Scope scope = 1;
  string runtime_id = 2;
  repeated bytes certificates = 3;
}

message BeginActivationRequest {
  Scope scope = 1;
  string incarnation_id = 2;
  string boot_id = 3;
  string request_id = 4;
  string client_nonce = 5;
}

message BeginActivationResponse {
  bytes jws = 1;
}

message ActivateNodeRequest {
  bytes challenge_jws = 1;
}

message ActivateNodeResponse {
  bytes session_jws = 1;
  bytes config_jws = 2;
  bytes lease_jws = 3;
}

message RecoverSessionRequest {
  RenewLeaseRequest session = 1;
  string expected_key_sha256 = 2;
}

message RecoverSessionResponse {
  bytes session_jws = 1;
  bytes config_jws = 2;
  bytes lease_jws = 3;
}

message GetSnapshotRequest {
  Scope scope = 1;
  string incarnation_id = 2;
}

message GetSnapshotResponse {
  bytes jws = 1;
}

message RenewLeaseRequest {
  Scope scope = 1;
  string incarnation_id = 2;
  string boot_id = 3;
  string session_generation = 4;
  string binding_generation = 5;
  string config_revision = 6;
  string config_hash = 7;
  string request_id = 8;
  string client_nonce = 9;
}

message RenewLeaseResponse {
  bytes jws = 1;
}

message ReportStateRequest {
  bytes report_jws = 1;
}

message ReportStateResponse {}

// Original admission tuple; counters are accepted IPv4 wire packets/bytes.
message FlowRecord {
  string source_id = 1;
  string destination_id = 2;
  string source_ip = 3;
  string destination_ip = 4;
  uint32 protocol = 5;
  uint32 source_port = 6;
  uint32 destination_port = 7;
  uint32 icmp_identifier = 8;
  uint64 forward_packets = 9;
  uint64 forward_bytes = 10;
  uint64 reverse_packets = 11;
  uint64 reverse_bytes = 12;
  int64 last_seen = 13;
  uint64 generation = 14;
}
message FlowEvent {
  FlowRecord flow = 1;
  uint64 cursor = 2;
  bool allowed = 3;
  string reason = 4;
}
message HostTelemetry {
  double cpu_percent = 1;
  double memory_percent = 2;
  double disk_percent = 3;
  string os = 4;
  string arch = 5;
  string system_boot_id = 6;
  string agent_version = 7;
  int64 observed_at = 8;
}
// Observacion orientativa del agente: no publica cargas, no concede acceso
// y no sustituye a la publicacion ni al permiso.
// Cada informe sustituye al anterior del mismo nodo y viaja por ReportFlows;
// authority lo lee por ReadProjection en ObservationView.telemetry para servir
// ListListeningPorts.
message ListeningPortsObservation {
  repeated n0x.workloads.v1.ListeningPort listening_ports = 1;
}
message FlowTelemetry {
  repeated FlowRecord flows = 1;
  repeated FlowEvent events = 2;
  uint64 cursor = 3;
  bool events_lost = 4;
  int64 observed_at = 5;
  string config_revision = 6;
  HostTelemetry host = 7;
  // Ausente: el agente no informo; dato no disponible, no acredita que no haya
  // puertos. Presente con lista vacia: no se observo ninguno.
  ListeningPortsObservation listening_ports = 8;
}
message ReportFlowsRequest {
  Scope scope = 1;
  string incarnation_id = 2;
  string boot_id = 3;
  string session_generation = 4;
  string binding_generation = 5;
  FlowTelemetry telemetry = 6;
}
message ReportFlowsResponse {}

service NodeControlService {
  rpc BeginActivation(BeginActivationRequest) returns (BeginActivationResponse);
  rpc ActivateNode(ActivateNodeRequest) returns (ActivateNodeResponse);
  rpc RecoverSession(RecoverSessionRequest) returns (RecoverSessionResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc ReportState(ReportStateRequest) returns (ReportStateResponse);
  rpc ReportFlows(ReportFlowsRequest) returns (ReportFlowsResponse);
  // Ruta mTLS de nodo: el sujeto y la sesion verificados deben corresponder
  // a request.identity_id y al account/tenant. Publicar no concede acceso.
  rpc RegisterWorkloadFromHost(RegisterWorkloadFromHostRequest) returns (RegisterWorkloadFromHostResponse);
}

message PublishConfigurationRequest {
  bytes config_document = 1;
  string expected_revision = 2;
  string request_id = 3;
}

message PublishConfigurationResponse {
  string revision = 1;
  string hash = 2;
  string request_id = 3;
}

message AcquireAuthorityGrantRequest {
  Scope scope = 1;
  string runtime_id = 2;
  string expected_epoch = 3;
  string expected_binding = 4;
  string config_revision = 5;
  string config_hash = 6;
  string request_id = 7;
}

message AcquireAuthorityGrantResponse {
  bytes jws = 1;
}

service AuthorityControlService {
  rpc PublishConfiguration(PublishConfigurationRequest) returns (PublishConfigurationResponse);
  rpc AcquireAuthorityGrant(AcquireAuthorityGrantRequest) returns (AcquireAuthorityGrantResponse);
}

message CommitRecoveryRequest {
  RecoveryCommit request = 1;
  repeated bytes node_certificates = 2;
}

message CommitRecoveryResponse {
  Activation activation = 1;
  bool found = 2;
}

message MarkEmissionDeliveredRequest {
  Scope scope = 1;
  string grant_id = 2;
}

message MarkEmissionDeliveredResponse {}

message ReadEmissionRequest {
  Scope scope = 1;
  string grant_id = 2;
}

message ReadEmissionResponse {
  Emission emission = 1;
  bool found = 2;
}

message CommitEmissionRequest {
  Emission emission = 1;
}

message CommitEmissionResponse {}

message CommitAckRequest {
  AckRequest request = 1;
}

message CommitAckResponse {}

message ReadScopeRequest {
  Scope scope = 1;
}

message ReadScopeResponse {
  ScopeState state = 1;
  bool found = 2;
}

message ReadConfigurationRequest {
  Scope scope = 1;
  string revision = 2;
  string hash = 3;
}

message ReadConfigurationResponse {
  bytes document = 1;
  bool found = 2;
}

message ReadActivationRequest {
  Scope scope = 1;
  string incarnation_id = 2;
}

message ReadActivationResponse {
  Activation activation = 1;
  bool found = 2;
}

message CommitActivationRequest {
  Scope scope = 1;
  string incarnation_id = 2;
  string boot_id = 3;
  string expected_generation = 4;
  string request_id = 5;
  string client_nonce = 6;
  string owner_runtime_id = 7;
  string owner_epoch = 8;
  repeated bytes node_certificates = 9;
  string expected_binding = 10;
}

message CommitActivationResponse {
  Activation activation = 1;
  bool found = 2;
}

service AuthorityStoreService {
  rpc CommitRecovery(CommitRecoveryRequest) returns (CommitRecoveryResponse);
  rpc MarkEmissionDelivered(MarkEmissionDeliveredRequest) returns (MarkEmissionDeliveredResponse);
  rpc ReadEmission(ReadEmissionRequest) returns (ReadEmissionResponse);
  rpc CommitEmission(CommitEmissionRequest) returns (CommitEmissionResponse);
  rpc CommitAck(CommitAckRequest) returns (CommitAckResponse);
  rpc ReadScope(ReadScopeRequest) returns (ReadScopeResponse);
  rpc ReadConfiguration(ReadConfigurationRequest) returns (ReadConfigurationResponse);
  rpc ReadActivation(ReadActivationRequest) returns (ReadActivationResponse);
  rpc CommitActivation(CommitActivationRequest) returns (CommitActivationResponse);
}

message ReadBrokerConfigurationRequest {
  Scope scope = 1;
  string revision = 2;
  string hash = 3;
}

message ReadBrokerConfigurationResponse {
  bytes document = 1;
  bool found = 2;
}

message ReadBrokerScopeRequest {
  Scope scope = 1;
}

message ReadBrokerScopeResponse {
  ScopeState state = 1;
  bool found = 2;
}

message ReadBrokerActivationRequest {
  Scope scope = 1;
  string incarnation_id = 2;
}

message ReadBrokerActivationResponse {
  Activation activation = 1;
  bool found = 2;
}

service BrokerStoreService {
  rpc ReadBrokerConfiguration(ReadBrokerConfigurationRequest) returns (ReadBrokerConfigurationResponse);
  rpc ReadBrokerScope(ReadBrokerScopeRequest) returns (ReadBrokerScopeResponse);
  rpc ReadBrokerActivation(ReadBrokerActivationRequest) returns (ReadBrokerActivationResponse);
}

message GetCandidateRequest {}

message GetCandidateResponse {
  OwnerCandidate candidate = 1;
}

service OwnershipCandidateService {
  rpc GetCandidate(GetCandidateRequest) returns (GetCandidateResponse);
}

message ChangeOwnerRequest {
  Scope scope = 1;
  string expected_epoch = 2;
  string expected_binding = 3;
  string request_id = 4;
  OwnerCandidate candidate = 5;
}

message ChangeOwnerResponse {
  ScopeState state = 1;
  bool found = 2;
}

service OwnershipAdminService {
  rpc ChangeOwner(ChangeOwnerRequest) returns (ChangeOwnerResponse);
}

message ReadProjectionRequest {
  string telemetry_incarnation_id = 50;
  Scope scope = 1;
  repeated string incarnation_ids = 2;
}

message ReadProjectionResponse {
  ProjectionSnapshot snapshot = 1;
  bool found = 2;
}

service ControlObservationsService {
  rpc ReadProjection(ReadProjectionRequest) returns (ReadProjectionResponse);
  // Solo authority autenticado por mTLS; lee el anillo sin depender de que
  // existan suscriptores en la consola ni del ultimo reporte de 1024 eventos.
  rpc ReadFlowEvents(ReadFlowEventsRequest) returns (ReadFlowEventsResponse);
}

message ClaimOwnerRequest {
  Scope scope = 1;
  string expected_epoch = 2;
  string expected_binding = 3;
  string expected_runtime_id = 4;
  int64 expected_horizon = 5;
  string runtime_id = 6;
  string request_id = 7;
  string instance_id = 8;
}

message ClaimOwnerResponse {
  ScopeState state = 1;
  bool found = 2;
}

message ClaimableScopesRequest {
  string instance_id = 1;
}

message ClaimableScopesResponse {
  ClaimableSnapshot snapshot = 1;
  bool found = 2;
}

message HandoffRequest {
  Scope scope = 1;
  string expected_epoch = 2;
  string expected_binding = 3;
  string expected_runtime_id = 4;
  int64 expected_horizon = 5;
  string expected_grant_seq = 6;
  string target_instance = 7;
  string request_id = 8;
}

message HandoffResponse {
  ScopeState state = 1;
  bool found = 2;
}

service OwnershipAutomaticService {
  rpc ClaimOwner(ClaimOwnerRequest) returns (ClaimOwnerResponse);
  rpc ClaimableScopes(ClaimableScopesRequest) returns (ClaimableScopesResponse);
  rpc Handoff(HandoffRequest) returns (HandoffResponse);
}

message DrainRequest {
  string instance_id = 1;
  string target_instance = 2;
}

message DrainResponse {
  DrainResult result = 1;
  bool found = 2;
}

service ControllerDrainService {
  rpc Drain(DrainRequest) returns (DrainResponse);
}

message GetRouteCandidateRequest {
  Scope scope = 1;
}

message GetRouteCandidateResponse {
  Scope scope = 1;
  string runtime_id = 2;
}

service OwnerRouteCandidateService {
  rpc GetRouteCandidate(GetRouteCandidateRequest) returns (GetRouteCandidateResponse);
}

message ReadRouteRequest {
  Scope scope = 1;
}

message ReadRouteResponse {
  Route route = 1;
  bool found = 2;
}

service OwnerRoutesService {
  rpc ReadRoute(ReadRouteRequest) returns (ReadRouteResponse);
}

message AdmitRequest {
  RenewLeaseRequest session = 1;
  string class = 2;
  string peer_incarnation = 3;
  string target_id = 4;
  string service_id = 5;
  repeated string candidates = 6;
}

message AdmitResponse {
  n0x.connectivity.v1.AdmitResult result = 1;
}

service ConnectivityControlService {
  rpc Admit(AdmitRequest) returns (AdmitResponse);
  // La sesion y el SVID de nodo se verifican como en Admit; request no puede
  // sustituir el sujeto autenticado ni escoger destinos fuera de la tabla.
  rpc AdmitWorkloadOffer(AdmitWorkloadOfferRequest) returns (AdmitWorkloadOfferResponse);
  rpc RenewWorkloadOffer(RenewWorkloadOfferRequest) returns (RenewWorkloadOfferResponse);
}

message LocateScopeRequest {
  Scope scope = 1;
  string incarnation_id = 2;
}

message LocateScopeResponse {
  string control_address = 1;
  string broker_address = 2;
  string owner_epoch = 3;
}

service NodeDiscoveryService {
  rpc LocateScope(LocateScopeRequest) returns (LocateScopeResponse);
}

// Private, mTLS owner-only alert evaluation persistence. Samples never cross it.
message ListAlertRulesRequest {
  Scope scope = 1;
  string owner_runtime_id = 2;
  string owner_epoch = 3;
}
message ListAlertRulesResponse {
  repeated n0x.alerts.v1.Rule rules = 1;
  repeated n0x.alerts.v1.Alert firing = 2;
}
message AlertTransition {
  string rule_id = 1;
  string incarnation_id = 2;
  string state = 3;
  int64 at = 4;
  int64 started_at = 5;
  string severity = 6;
  string reason = 7;
}
message RecordAlertTransitionsRequest {
  Scope scope = 1;
  string owner_runtime_id = 2;
  string owner_epoch = 3;
  repeated AlertTransition transitions = 4;
}
message RecordAlertTransitionsResponse {}
service AlertEvaluationService {
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse);
  rpc RecordAlertTransitions(RecordAlertTransitionsRequest) returns (RecordAlertTransitionsResponse);
}

message AdmitWorkloadOfferRequest {
  RenewLeaseRequest session = 1;
  n0x.connectivity.v1.AdmitWorkloadOfferRequest request = 2;
}

message RenewWorkloadOfferRequest {
  RenewLeaseRequest session = 1;
  n0x.connectivity.v1.RenewWorkloadOfferRequest request = 2;
}

message RegisterWorkloadFromHostRequest {
  RenewLeaseRequest session = 1;
  n0x.workloads.v1.RegisterWorkloadFromHostRequest request = 2;
}

// Salto interno controller -> resources: solo lo llama el controller por mTLS
// con su SVID fijado, tras verificar el SVID de nodo y la Session en
// NodeControlService.RegisterWorkloadFromHost. Nunca lo llama un nodo ni una
// persona. Publicar no concede acceso.
service NodeWorkloadRegistrationService {
  rpc RegisterNodeWorkload(RegisterNodeWorkloadRequest) returns (RegisterNodeWorkloadResponse);
}

message RegisterNodeWorkloadRequest {
  // Scope e incarnation_id salen del SVID de nodo verificado, nunca del cuerpo
  // enviado por el nodo.
  Scope scope = 1;
  optional string incarnation_id = 2;
  // Resources resuelve la encarnacion a account_id, tenant_id e identity_id en
  // su propio estado y rechaza si request no coincide con esos valores.
  n0x.workloads.v1.RegisterWorkloadFromHostRequest request = 3;
}

message RegisterNodeWorkloadResponse {
  n0x.workloads.v1.RegisterWorkloadFromHostResponse response = 1;
}

// El scope se autoriza igual que en ReadProjection; no se aceptan ambitos
// de cuenta o tenant independientes que puedan contradecirlo.
message ReadFlowEventsRequest {
  Scope scope = 1;
  // Cursor opaco exclusivo ligado al scope y a la epoca del anillo. Vacio
  // inicia en el evento mas antiguo retenido, no en la frontera en vivo.
  optional string cursor = 2;
  // Cero usa 100; maximo 1000; valores negativos no son validos.
  optional int32 page_size = 3;
}

// Conserva el origen del flujo para que authority normalice sesiones por
// encarnacion/boot y 5-tupla, sin mover esa logica al controller.
message FlowEventEntry {
  optional string incarnation_id = 1;
  optional string boot_id = 2;
  FlowEvent event = 3;
}

message ReadFlowEventsResponse {
  // Orden estable del anillo; FlowEvent.cursor sigue siendo local al nodo/boot.
  repeated FlowEventEntry entries = 1;
  // Limite seguro tras esta pagina, tambien vacia. Persistirlo para la siguiente
  // lectura; deduplicar por encarnacion, boot y FlowEvent.cursor tras retry.
  optional string cursor = 2;
  optional bool has_more = 3;
  // Expulsion por capacidad/edad o reinicio: nunca certificar continuidad
  // silenciosamente. Se devuelve lo retenido y un nuevo cursor utilizable.
  // Retencion maxima de 24 h en memoria; no garantiza 24 h tras un reinicio.
  optional bool history_lost = 4;
}

// Envolturas propias de la ruta de control; conservan los mensajes de dominio.
message AdmitWorkloadOfferResponse {
  n0x.connectivity.v1.AdmitWorkloadOfferResponse response = 1;
}

message RenewWorkloadOfferResponse {
  n0x.connectivity.v1.RenewWorkloadOfferResponse response = 1;
}

message RegisterWorkloadFromHostResponse {
  n0x.workloads.v1.RegisterWorkloadFromHostResponse response = 1;
}
