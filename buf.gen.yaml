{
  "version": "v2",
  "clean": false,
  "plugins": [
    {
      "local": "protoc-gen-go",
      "out": "gen/go",
      "opt": [
        "module=github.com/n-0x/x-api-go"
      ]
    },
    {
      "local": "protoc-gen-go-grpc",
      "out": "gen/go",
      "opt": [
        "module=github.com/n-0x/x-api-go"
      ]
    },
    {
      "local": "protoc-gen-connect-go",
      "out": "gen/go",
      "opt": [
        "module=github.com/n-0x/x-api-go"
      ]
    },
    {
      "local": "protoc-gen-es",
      "out": "gen/ts",
      "opt": [
        "target=js+dts",
        "import_extension=js"
      ]
    }
  ]
}
